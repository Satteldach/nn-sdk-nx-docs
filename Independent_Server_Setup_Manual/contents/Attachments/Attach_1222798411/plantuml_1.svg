@startuml
 
skinparam default {
  FontName "VL P Gothic"
}

skinparam sequence {
  ArrowColor #2C2918

  ActorBorderColor #3E3F41   
  ActorBackgroundColor #F7F7F7
  ActorFontColor #3E3F41
  ActorFontSize 14

  LifeLineBorderColor #A19B88
  LifeLineBackgroundColor #F7F7F7
     
  ParticipantBorderColor #3E3F41
  ParticipantBackgroundColor #F7F7F7
  ParticipantFontSize 14
  ParticipantFontColor #3E3F41
   
  BoxLineColor #A19B88
  BoxBackgroundColor #F7F7F7
}

 
box "Nintendo Account Server"
  participant "Token endpoint" as TokenEP
  participant "API for getting the history for canceling user authorization" as unauthzAPI
end box


participant "Independent server" as LoginEP
 
autonumber 1

activate LoginEP

LoginEP -> TokenEP : Token client (client_credentials)
activate TokenEP

LoginEP <- - TokenEP : Token response
 
deactivate TokenEP
LoginEP <- - LoginEP : Token cache


LoginEP -> unauthzAPI : Gets the history for canceling user authorization
activate unauthzAPI

LoginEP <- - unauthzAPI : The history for canceling user authorization
deactivate unauthzAPI

opt "If data needs to be deleted"
  LoginEP -> LoginEP : Delete data
end opt 
deactivate LoginEP


@enduml

