thic" font-size="13" lengthAdjust="spacing" textLength="86" x="57.5" y="596.0264">Start of service</text><!--MD5=[b57e7de3205cd717512e9db24c4b20aa]
@startuml
 
skinparam default {
  FontName "VL P Gothic"
}

skinparam sequence {
  ArrowColor #2C2918

  ActorBorderColor #3E3F41   
  ActorBackgroundColor #F7F7F7
  ActorFontColor #3E3F41
  ActorFontSize 14

  LifeLineBorderColor #A19B88
  LifeLineBackgroundColor #F7F7F7
     
  ParticipantBorderColor #3E3F41
  ParticipantBackgroundColor #F7F7F7
  ParticipantFontSize 14
  ParticipantFontColor #3E3F41
   
  BoxLineColor #A19B88
  BoxBackgroundColor #F7F7F7
}


actor "User" as User

box "Switch"
  participant "Application" as NXApp
  participant "nn:account" as NXActMgr
end box

 
box "Nintendo Account Server"
  participant "Authentication Endpoint" as AuthEP
end box

box "Nintendo Authentication Server"
  participant "Authentication Endpoint" as AuthEP
  participant "Public Key Endpoint" as CertEP
end box

participant "Independent Server" as LoginEP

 
autonumber 1

User -> NXApp: Begin using network services
activate NXApp
 
NXApp -> NXActMgr: NSA ID token request
activate NXActMgr
NXActMgr -> AuthEP: NSA ID token request
activate AuthEP

AuthEP -> AuthEP: Authentication
NXActMgr <- - AuthEP : Authentication result
deactivate AuthEP

NXApp <- - NXActMgr : Authentication result
deactivate NXActMgr

 
NXApp -> LoginEP : Access request (NSA ID token)
activate LoginEP
alt "If there is no key for NSA ID token verification"
  LoginEP -> CertEP: Getting a public key
  LoginEP <- - CertEP: Public key
  LoginEP -> LoginEP: Public key cache
end
LoginEP -> LoginEP: NSA ID token verification
LoginEP -> LoginEP : Authentication process
NXApp <- - LoginEP : Session
deactivate LoginEP

User <- - NXApp : Start of service

deactivate NXApp

@enduml

