@startuml

actor "End User" as EndUser
 
box "Switch"
 participant "Game App" as GameApp
 participant "nn::account" as account
end box
 
participant "Independent\nServer" as GameServer

participant "Nintendo eShop Server" as eShopServer
 
== Connecting to an Independent Server ==
 
EndUser -> GameApp: Start the Game 
activate GameApp



GameApp -> account : Request to get the network-service account ID token cache.
activate account

GameApp <- - account : Network service account ID token

deactivate account


GameApp -> GameServer : Request to connect to an Independent Server (ID token)
activate GameServer
GameServer -> GameServer : Verify the ID token
GameApp <- - GameServer : Session


== License Check ==
 

GameApp -> GameServer : Subscription term query


GameServer -> eShopServer: API for Referencing Licensing Information
 
activate eShopServer

GameServer <- - eShopServer: Subscription term response (end time, or remaining time if the subscription not started, or no license)
deactivate eShopServer
 
opt If the subscription has not started and there is still time remaining
  GameServer -> eShopServer: API for Starting to Use the License
  activate eShopServer
  GameServer <- - eShopServer: Success response (end time)
  deactivate eShopServer
end

GameApp <- - GameServer: Term response (end time)
deactivate GameServer

EndUser <- - GameApp : Display the remaining term
deactivate GameApp

 
@enduml

